<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dance to the Rhythm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="menu-wrapper">
        <section class="menu-card">
            <header class="menu-header">
                <p class="eyebrow">Rhythm Game</p>
                <h1 class="site-title">Dance to the Rhythm</h1>
            </header>
            <div class="game-list" id="gameList">
            </div>
        </section>
    </main>
        <script>
            (async () => {
                try {
                    const res = await fetch('./assets/songs.config.json');
                    const cfg = await res.json();
                    const container = document.getElementById('gameList');
                    container.innerHTML = '';
                    cfg.songs.forEach(s => {
                        const art = document.createElement('article');
                        art.className = 'game-item';
                        const div = document.createElement('div');
                        const h2 = document.createElement('h2');
                        h2.textContent = s.title.replace(/\.mp3$/i, '').replace(/_/g,' ');
                        div.appendChild(h2);
                        const a = document.createElement('a');
                        a.className = 'btn primary';
                        a.href = s.pagePath || '#';
                        a.textContent = 'Грати';
                        const meta = document.createElement('p');
                        meta.textContent = `BPM: ${s.bpm} · ${Math.round(s.durationSec)}s · ${s.difficulty}`;
                        art.appendChild(div);
                        art.appendChild(meta);
                        art.appendChild(a);
                        container.appendChild(art);
                    });
                } catch (e) { console.warn('Failed to load songs.config.json', e); }
            })();
        </script>
    </body>
</html>
